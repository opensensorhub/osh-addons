description = 'MQTT Server (HiveMQ)'
ext.details = 'Implementation of MQTT client/server API using HiveMQ'
version = '0.3.1'


dependencies {
  implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
  implementation project(':sensorhub-comm-mqtt')
  // token login uses the token check of the OAuth module
  implementation project(':sensorhub-security-oauth')
  embeddedImpl 'org.eclipse.jetty:jetty-util:9.4.19.v20190610'
  embeddedImpl('com.hivemq:hivemq-community-edition-embedded:2023.8') {
    exclude group: 'com.google.guava', module: 'guava'
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }
  // the tests make signed tokens
  testImplementation 'com.auth0:java-jwt:4.4.0'
  testImplementation 'com.auth0:jwks-rsa:0.22.1'
}

// add the README to the jar, for the README tab of the Admin UI
processResources {
  from('README.md') { into 'org/sensorhub/impl/service/hivemq' }
}

// add info to OSGi manifest
osgi {
  manifest {
    attributes('Bundle-Vendor': 'Sensia Software LLC')
    attributes('Bundle-Activator': 'org.sensorhub.impl.service.hivemq.Activator')
  }
}

// add info to maven pom
ext.pom >>= {
  developers {
    developer {
      id 'alexrobin'
      name 'Alex Robin'
      organization 'Sensia Software LLC'
      organizationUrl 'http://www.sensiasoftware.com' 
    }
  }
}

