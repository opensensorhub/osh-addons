asyncapi: 3.0.0
id: urn:osh:csapi-mqtt:${nodeId}
info:
  title: OSH Connected Systems API - MQTT binding
  version: ${version}
  description: |-
    MQTT binding of the OSH Connected Systems (CS) API, module
    `sensorhub-service-csapi-mqtt`. It follows the MQTT binding of
    OGC API - Connected Systems Part 3 (draft). The work is not complete.
    The legacy topics, under the CS API HTTP endpoint, are in the module
    `sensorhub-service-consys-mqtt`.

    CS API HTTP server: ${apiRoot}

    **What it does**

    - Subscribe to a Resource Data topic to get live data.
    - Publish to a Resource Data topic to create one resource. MQTT cannot
      update or delete resources.
    - Subscribe to a Resource Event topic to know when a system, subsystem,
      datastream or control stream is created, updated or deleted.
    - Subscribe to the Batch Resource Event topic of a datastream to know how
      many observations were created in each time window.
    - The CS API checks each request. The same users and permissions apply
      as for HTTP.

    **Topics**

    - Every topic starts with `${nodeId}/`.
    - Data topics end with `:data` on the last collection name.
    - `:data/{format}` selects a format. Plain `:data` uses the default format.
    - Resource Event topics have no `:data`. They end with the ID of one
      resource, for example `${nodeId}/systems/{id}/datastreams/{id}`.
    - Batch Resource Event topics have no `:data`. They end with the name of
      the collection, for example
      `${nodeId}/systems/{id}/datastreams/{id}/observations`.
    - This document lists topics for resources of a top-level system. For a
      subsystem, insert `/subsystems/{id}` after `systems/{id}`, once for
      each level, for example
      `${nodeId}/systems/{id}/subsystems/{id}/datastreams/{id}/observations:data`.

    **Format names**

    ${formatList}

    A format that the resource does not support is rejected. There is no
    fallback to the default format.

    **Not done yet**

    - Resource Events for other resource types. Events are published for
      systems, subsystems, datastreams and control streams only.
    - Batch Resource Events for collections other than observations.
    - Wildcard subscriptions (`+`, `#`). These topics are rejected.
    - MQTT 5 Content Type. The server does not set it. Clients must use
      the topic to know the format. Resource Events are always
      `application/cloudevents+json`.
    - Command result topics (`.../commands/{id}/result:data`).

    **Delivery**

    - The server publishes with QoS 1 and retain false.
    - The broker keeps sessions in memory. Sessions do not survive a restart.
    - There are no ordering or replay guarantees beyond MQTT. QoS does not
      guarantee exactly-once creation of resources or commands.
    - Data goes only to topics with subscribers. There is no retained state.
    - The broker uses its default maximum message size.

    **Errors**

    - The embedded OSH broker rejects a bad subscription in SUBACK and a bad
      publication in PUBACK, with an MQTT 5 reason code and reason string.
    - MQTT 3.1.1 clients get no reason. QoS 0 publications get no reply.
    - There is no asynchronous error topic yet.

    **Known limits**

    - The topic shape is checked. That each ID belongs to the resource before
      it is not checked by the CS API.
    - The status topic of one command carries the status of all commands on
      its control stream.
    - `swe-xml` publications create the resource but are reported as invalid.
    - A Resource Event subscription needs an existing resource that the user
      can read. Without wildcards, a client cannot get the `create` event of
      a new resource.
    - A system update sends an event only if it adds a new version (a later
      `validTime`). Deleting a system sends no events for its datastreams and
      control streams. Enabling or disabling a resource sends no event.
    - Each Resource Event is published on the topic of its resource only, not
      on the topics of parent systems.
    - Batch Resource Events are published for each datastream that gets
      observations, also when no client subscribes. Observations not yet
      published when the service stops are not counted.
  contact:
    name: OpenSensorHub
    url: https://github.com/opensensorhub/osh-addons
  license:
    name: Mozilla Public License 2.0
    url: https://mozilla.org/MPL/2.0/
  externalDocs:
    description: OGC API - Connected Systems Part 3 working draft
    url: https://github.com/opengeospatial/ogcapi-connected-systems/tree/master/api/part3

defaultContentType: application/json

servers:
${servers}
channels:
  observations:
    address: '${nodeId}/systems/{systemId}/datastreams/{dataStreamId}/observations:data'
    title: Observations of a datastream (default format)
    messages:
      observation:
        $ref: '#/components/messages/observation'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      dataStreamId:
        $ref: '#/components/parameters/dataStreamId'
    x-ogc-link:
      rel: collection
      type: application/json
      href: '${apiRoot}/datastreams'
  observationsFormat:
    address: '${nodeId}/systems/{systemId}/datastreams/{dataStreamId}/observations:data/{format}'
    title: Observations of a datastream (selected format)
    description: The datastream lists its formats in `formats` over HTTP. Video
      datastreams offer only `om-json` and `swe-binary`.
    messages:
      observation:
        $ref: '#/components/messages/formatted'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      dataStreamId:
        $ref: '#/components/parameters/dataStreamId'
      format:
        $ref: '#/components/parameters/format'
  commands:
    address: '${nodeId}/systems/{systemId}/controlstreams/{controlStreamId}/commands:data'
    title: Commands of a control stream (default format)
    messages:
      command:
        $ref: '#/components/messages/command'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      controlStreamId:
        $ref: '#/components/parameters/controlStreamId'
    x-ogc-link:
      rel: collection
      type: application/json
      href: '${apiRoot}/controlstreams'
  commandsFormat:
    address: '${nodeId}/systems/{systemId}/controlstreams/{controlStreamId}/commands:data/{format}'
    title: Commands of a control stream (selected format)
    messages:
      command:
        $ref: '#/components/messages/formatted'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      controlStreamId:
        $ref: '#/components/parameters/controlStreamId'
      format:
        $ref: '#/components/parameters/format'
  commandStatus:
    address: '${nodeId}/systems/{systemId}/controlstreams/{controlStreamId}/commands/{commandId}/status:data'
    title: Status of a command
    description: Known limit - this topic carries the status of all commands
      on the control stream, not only command `{commandId}`.
    messages:
      status:
        $ref: '#/components/messages/commandStatus'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      controlStreamId:
        $ref: '#/components/parameters/controlStreamId'
      commandId:
        $ref: '#/components/parameters/commandId'
  systemEvents:
    address: '${nodeId}/systems/{systemId}/events:data'
    title: System events of a system
    messages:
      event:
        $ref: '#/components/messages/systemEvent'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
  systems:
    address: '${nodeId}/systems:data'
    title: Top-level systems
    messages:
      system:
        $ref: '#/components/messages/system'
    x-ogc-link:
      rel: collection
      type: application/json
      href: '${apiRoot}/systems'
  subsystems:
    address: '${nodeId}/systems/{systemId}/subsystems:data'
    title: Subsystems of a system
    messages:
      system:
        $ref: '#/components/messages/system'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
  dataStreams:
    address: '${nodeId}/systems/{systemId}/datastreams:data'
    title: Datastreams of a system
    messages:
      dataStream:
        $ref: '#/components/messages/dataStream'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
  controlStreams:
    address: '${nodeId}/systems/{systemId}/controlstreams:data'
    title: Control streams of a system
    messages:
      controlStream:
        $ref: '#/components/messages/controlStream'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
  systemResourceEvents:
    address: '${nodeId}/systems/{systemId}'
    title: Resource Events of a top-level system
    messages:
      event:
        $ref: '#/components/messages/systemResourceEvent'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
  subsystemResourceEvents:
    address: '${nodeId}/systems/{systemId}/subsystems/{subsystemId}'
    title: Resource Events of a subsystem
    description: For deeper levels, insert `/subsystems/{id}` once for each
      level. `resourceparent` is the parent system.
    messages:
      event:
        $ref: '#/components/messages/systemResourceEvent'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      subsystemId:
        $ref: '#/components/parameters/subsystemId'
  dataStreamResourceEvents:
    address: '${nodeId}/systems/{systemId}/datastreams/{dataStreamId}'
    title: Resource Events of a datastream
    messages:
      event:
        $ref: '#/components/messages/dataStreamResourceEvent'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      dataStreamId:
        $ref: '#/components/parameters/dataStreamId'
  observationBatchEvents:
    address: '${nodeId}/systems/{systemId}/datastreams/{dataStreamId}/observations'
    title: Batch Resource Events of the observations of a datastream
    description: At most one event for each window of ${batchWindowMs} ms.
      After a quiet window, the first event is published at once. A window
      with no new observations has no event. The subscriber must be able to
      read the datastream.
    messages:
      event:
        $ref: '#/components/messages/observationBatchEvent'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      dataStreamId:
        $ref: '#/components/parameters/dataStreamId'
  controlStreamResourceEvents:
    address: '${nodeId}/systems/{systemId}/controlstreams/{controlStreamId}'
    title: Resource Events of a control stream
    messages:
      event:
        $ref: '#/components/messages/controlStreamResourceEvent'
    parameters:
      systemId:
        $ref: '#/components/parameters/systemId'
      controlStreamId:
        $ref: '#/components/parameters/controlStreamId'

# Operations are seen from the server: 'send' means the server publishes and
# clients subscribe; 'receive' means clients publish and the server creates.
operations:
  sendObservations:
    action: send
    channel:
      $ref: '#/channels/observations'
    summary: Stream new observations of a datastream.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  receiveObservations:
    action: receive
    channel:
      $ref: '#/channels/observations'
    summary: Create one observation per publication.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  sendObservationsFormat:
    action: send
    channel:
      $ref: '#/channels/observationsFormat'
    summary: Stream new observations in the selected format.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  receiveObservationsFormat:
    action: receive
    channel:
      $ref: '#/channels/observationsFormat'
    summary: Create one observation per publication, in the selected format.
    description: Tested with `om-json`, `swe-json` and `swe-csv`.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  receiveCommands:
    action: receive
    channel:
      $ref: '#/channels/commands'
    summary: Send one command per publication to the system.
    description: Put the command fields in `parameters`. Give all fields of the
      control stream schema.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  sendCommands:
    action: send
    channel:
      $ref: '#/channels/commands'
    summary: Deliver commands to a client that executes them.
    description: A subscriber becomes the command executor of the control
      stream. The subscription is rejected if a driver or another client
      already executes the commands.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  receiveCommandsFormat:
    action: receive
    channel:
      $ref: '#/channels/commandsFormat'
    summary: Send one command per publication, in the selected format.
    description: Tested with `json`, `swe-json` and `swe-csv`.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  sendCommandStatus:
    action: send
    channel:
      $ref: '#/channels/commandStatus'
    summary: Stream command status reports.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  sendSystemEvents:
    action: send
    channel:
      $ref: '#/channels/systemEvents'
    summary: Stream new system events.
    description: The subscription is accepted. Delivery is not tested yet.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  receiveSystems:
    action: receive
    channel:
      $ref: '#/channels/systems'
    summary: Create a top-level system. Subscriptions are rejected.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  receiveSubsystems:
    action: receive
    channel:
      $ref: '#/channels/subsystems'
    summary: Create a subsystem. Subscriptions are rejected.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  receiveDataStreams:
    action: receive
    channel:
      $ref: '#/channels/dataStreams'
    summary: Create a datastream. Subscriptions are rejected.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  receiveControlStreams:
    action: receive
    channel:
      $ref: '#/channels/controlStreams'
    summary: Create a control stream. Subscriptions are rejected.
    bindings:
      mqtt: {qos: 1, bindingVersion: 0.2.0}
  sendSystemResourceEvents:
    action: send
    channel:
      $ref: '#/channels/systemResourceEvents'
    summary: Notify that a top-level system was created, updated or deleted.
    description: Publications by clients are rejected.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  sendSubsystemResourceEvents:
    action: send
    channel:
      $ref: '#/channels/subsystemResourceEvents'
    summary: Notify that a subsystem was created, updated or deleted.
    description: Publications by clients are rejected.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  sendDataStreamResourceEvents:
    action: send
    channel:
      $ref: '#/channels/dataStreamResourceEvents'
    summary: Notify that a datastream was created, updated or deleted.
    description: Publications by clients are rejected.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  sendControlStreamResourceEvents:
    action: send
    channel:
      $ref: '#/channels/controlStreamResourceEvents'
    summary: Notify that a control stream was created, updated or deleted.
    description: Publications by clients are rejected.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}
  sendObservationBatchEvents:
    action: send
    channel:
      $ref: '#/channels/observationBatchEvents'
    summary: Give the number of observations created in each time window.
    description: Publications by clients are rejected.
    bindings:
      mqtt: {qos: 1, retain: false, bindingVersion: 0.2.0}

components:
  parameters:
    systemId:
      description: Local ID of a system in the CS API.
    dataStreamId:
      description: Local ID of a datastream in the CS API.
    controlStreamId:
      description: Local ID of a control stream in the CS API.
    subsystemId:
      description: Local ID of a subsystem in the CS API.
    commandId:
      description: Local ID of a command in the CS API.
    format:
      description: Format name, made from the media type (remove parameters and
        `application/`, change `+` to `-`, use lowercase).
      enum: [${formatEnum}]
  schemas:
    resourceEvent:
      type: object
      description: CloudEvents 1.0 structured JSON. There is no `data` member.
      required: [specversion, id, type, source, subject, time]
      properties:
        specversion: {const: '1.0'}
        id: {type: string, description: Different for each event.}
        type: {type: string}
        source: {type: string, format: uri, description: The CS API root URL.}
        subject:
          type: string
          format: uri
          description: HTTP URL of the resource, for example
            `${apiRoot}/datastreams/{id}`. It is not the topic path.
        time: {type: string, format: date-time}
        resourceparent:
          type: string
          format: uri
          description: HTTP URL of the parent system. Absent for a top-level
            system.
    batchEvent:
      type: object
      description: CloudEvents 1.0 structured JSON, with a `data` member.
      required: [specversion, id, type, source, subject, time, resourceparent, datacontenttype, data]
      properties:
        specversion: {const: '1.0'}
        id: {type: string, description: Different for each event.}
        type: {type: string}
        source: {type: string, format: uri, description: The CS API root URL.}
        subject:
          type: string
          format: uri
          description: HTTP URL of the collection, for example
            `${apiRoot}/datastreams/{id}/observations`.
        time: {type: string, format: date-time}
        resourceparent:
          type: string
          format: uri
          description: HTTP URL of the datastream, for example
            `${apiRoot}/datastreams/{id}`.
        datacontenttype: {const: application/json}
        data:
          type: object
          required: [timerange, count]
          properties:
            timerange:
              type: array
              description: Times of the first and last observation event in
                the batch, in order.
              items: {type: string, format: date-time}
              minItems: 2
              maxItems: 2
            count:
              type: integer
              minimum: 0
              description: Number of observations created in `timerange`.
  messages:
    systemResourceEvent:
      name: systemResourceEvent
      title: System Resource Event
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/resourceEvent'
          - properties:
              type:
                enum: [org.ogc.api.csapi.system.create, org.ogc.api.csapi.system.update, org.ogc.api.csapi.system.delete]
    dataStreamResourceEvent:
      name: dataStreamResourceEvent
      title: Datastream Resource Event
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/resourceEvent'
          - required: [resourceparent]
            properties:
              type:
                enum: [org.ogc.api.csapi.datastream.create, org.ogc.api.csapi.datastream.update, org.ogc.api.csapi.datastream.delete]
    controlStreamResourceEvent:
      name: controlStreamResourceEvent
      title: Control stream Resource Event
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/resourceEvent'
          - required: [resourceparent]
            properties:
              type:
                enum: [org.ogc.api.csapi.controlstream.create, org.ogc.api.csapi.controlstream.update, org.ogc.api.csapi.controlstream.delete]
    observationBatchEvent:
      name: observationBatchEvent
      title: Observation Batch Resource Event
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '#/components/schemas/batchEvent'
          - properties:
              type:
                enum: [org.ogc.api.csapi.observation.create]
    observation:
      name: observation
      title: Observation
      contentType: application/json
      summary: One observation in the default JSON format.
      payload:
        type: object
      externalDocs:
        description: The result schema of each datastream
        url: '${apiRoot}/datastreams'
    formatted:
      name: formatted
      title: Resource in the selected format
      summary: One resource in the format of the `{format}` topic level. The
        payload is text or binary, as the format sets.
      payload: {}
    command:
      name: command
      title: Command
      contentType: application/json
      summary: One command. The fields go in `parameters`.
      payload:
        type: object
        required: [parameters]
        properties:
          parameters:
            type: object
    commandStatus:
      name: commandStatus
      title: Command status
      contentType: application/json
      payload:
        type: object
        properties:
          command@id: {type: string}
          statusCode: {type: string}
          reportTime: {type: string, format: date-time}
    systemEvent:
      name: systemEvent
      title: System event
      contentType: application/json
      payload:
        type: object
    system:
      name: system
      title: System
      contentType: application/geo+json
      summary: A system in GeoJSON. Use the `sml-json` format subtopic for SensorML.
      payload:
        type: object
    dataStream:
      name: dataStream
      title: Datastream
      contentType: application/json
      payload:
        type: object
    controlStream:
      name: controlStream
      title: Control stream
      contentType: application/json
      payload:
        type: object
