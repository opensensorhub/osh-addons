description = 'GPMF Telemetry Processing'
ext.details = 'Decodes GoPro GPMF telemetry packets into per-stream telemetry records and GPS position fixes'
version = '1.0.0'

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    testImplementation('junit:junit:4.13.1')
}

test {
    useJUnit()
}

// add info to OSGi manifest
osgi {
    manifest {
        attributes('Bundle-Vendor': 'GeoRobotix Innovative Research, LLC.')
        attributes('Bundle-Activator': 'org.sensorhub.impl.process.gpmf.Activator')
    }
}

// add info to maven pom
ext.pom >>= {
    developers {
        developer {
            name 'Kyle Fitzpatrick'
            organization 'GeoRobotix Innovative Research, LLC.'
            organizationUrl 'https://georobotix.us'
        }
    }
}